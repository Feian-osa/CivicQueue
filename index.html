<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Service Token Portal</title>
    <!-- Tailwind CSS Script for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl space-y-6">
        <div>
            <span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">Citizen Portal</span>
            <h1 class="text-xl font-bold text-white mt-2">Generate Service Token</h1>
            <p class="text-xs text-gray-400 mt-1">Select a government service and enter your details to join the queue.</p>
        </div>

        <!-- Token Generation Form -->
        <form id="tokenForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Full Name</label>
                <input type="text" id="citizen_name" required class="w-full px-3 py-2 bg-gray-950 border border-gray-800 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Sita Sharma">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Phone Number</label>
                <input type="text" id="citizen_phone" required class="w-full px-3 py-2 bg-gray-950 border border-gray-800 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500" placeholder="e.g. 9812345678">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Select Service</label>
                <select id="service_id" required class="w-full px-3 py-2 bg-gray-950 border border-gray-800 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="">Loading services...</option>
                </select>
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg text-sm transition-colors cursor-pointer">
                Get Token
            </button>
        </form>

        <!-- Success Result Box (Hidden by default) -->
        <div id="resultBox" class="hidden p-4 bg-emerald-950/30 border border-emerald-800/40 rounded-lg space-y-2 text-xs">
            <div class="font-bold text-emerald-300 text-sm">Token Generated Successfully! 🎉</div>
            <div><strong>Token Number:</strong> <span id="resTokenNum" class="text-white font-mono text-sm"></span></div>
            <div><strong>Queue Position:</strong> <span id="resQueuePos" class="text-white font-bold"></span></div>
            <p class="text-[10px] text-gray-400 pt-1">Please note down your token number or keep this screen open.</p>
        </div>
    </div>

    <!-- Link to the separate JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
